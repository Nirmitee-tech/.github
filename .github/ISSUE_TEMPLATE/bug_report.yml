name: Bug report
description: Something is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include real patient data, PHI, credentials or client details** — use synthetic data in any message, resource or file you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, runtime version, OS, and any relevant upstream system (EHR, engine, clearinghouse) and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or sample payload
      description: Synthetic data only. This will be rendered as code.
      render: shell
